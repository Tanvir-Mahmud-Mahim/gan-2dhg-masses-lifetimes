# Verified experimental and theoretical parameters for the polarisation-induced
# GaN/AlN two-dimensional hole gas.
#
# PROVENANCE RULE.  Every entry carries the source it was read from and how it
# was read.  "primary_pdf" means the full text of the paper itself was opened
# and the number read from it.  "abstract" means only the abstract was
# accessible.  Nothing in this file was taken from memory or from a secondary
# summary.  Entries that could not be verified are marked unverified: true and
# must not be used in the manuscript.

meta:
  compiled: 2026-08-04
  revised: 2026-09-25 (light-hole analysis added)
  rule: "No number enters the manuscript unless verified: true."
  citation_audit:
    date: 2026-08-04
    scope: "Every reference in the Letter and in the Supplemental Material."
    doi_check: "Each DOI resolved and the returned record compared field by
      field with the bibliography entry: title, author order, journal, volume,
      issue, page or article number, year. Registries used: Crossref, OpenAlex,
      and the publisher page or author-hosted PDF where those were incomplete.
      All entries matched; no correction to any bibliographic field was needed."
    entries_removed: "Two entries were defined but never cited and have been
      deleted: Dill et al., Appl. Phys. Lett. 127, 032105 (2025), and Ponce,
      Jena and Giustino, Phys. Rev. B 100, 085204 (2019)."
    aps_compliance: "Fang and Howard (1966) and de Carvalho et al. (2010) were
      cited in the Supplemental Material but absent from the Letter's reference
      list, which APS requires. Both are now cited in the Letter."
    claims_verified:
      - "Chang et al.: 'a short-range, large-angle scattering mechanism such as
         interface roughness scattering' - verbatim, arXiv full text."
      - "Chang et al. methods: 'The Rashba-Sheka-Pikus parameters (A1-6) and the
         deformation potentials (acz-D1, act-D2, D3-6) are taken from ref. 61
         and ref. 62, respectively', ref. 61 Rinke et al. 2008, ref. 62 Yan
         et al. 2014 - verbatim, arXiv full text."
      - "Wang et al.: 31 T maximum field, masses 0.57(1) and 2.6(2), densities
         0.65(3) and 4.6(2)e13, times 4.0(2) and 3.9(2)e-13 s, 8 K - all
         re-read from the author-hosted PDF."
      - "Dill et al.: 'transport simulations should predict and be corroborated
         against measurements of R_sh and R_H, which are directly measurable,
         rather than n and mu' - verbatim, arXiv full text. Mobilities at 2 K
         1350-1580 (light) and 222-393 (heavy) cm2/Vs, so the values quoted as
         near 1400 and 300 lie inside both ranges."
      - "Costa et al.: the criterion g* m* = 1 for equal orbital and Zeeman
         gaps - verbatim, arXiv:2509.15268."
      - "Rizzi et al. -0.3 +/- 0.1 eV; King et al. 0.5 +/- 0.2 and 0.8 +/- 0.2
         eV. (Corrected 2026-09-25: this line previously read 0.56 and 0.86,
         a text-extraction artifact in which the plus-minus sign of the PDF
         was rendered as the digit 6. See second_revision_audit.)"
    unresolved:
      - "The erratum, J. Appl. Phys. 139, 249901 (2026), remains inaccessible.
         The manuscript previously asserted that it left the working equations
         and the subsequent analysis unaffected. That assertion was not
         supported by anything read and has been removed. As of 2026-09-25 no
         number in the manuscript is taken from Dill et al. or its erratum;
         the work is cited for the two-carrier fitting procedure only."

  revision_audit:
    date: 2026-09-24
    scope: "Every reference in the revised Letter and Supplemental Material,
      including the two added in revision."
    doi_check: "Each DOI resolved through OpenAlex or Crossref and compared
      with title, author order, journal, volume, issue, pages and year. All
      nineteen journal articles matched. Article numbers not returned by OpenAlex
      (Rinke 075202, Yan 125118, Dill 025702, Dill erratum 249901, Bader
      253501, Costa 115418, Huang and Wu 020901, de Carvalho 232101) were
      verified against Crossref in the audit of 2026-08-04 and are consistent
      with the issue numbers returned now."
    entries_added:
      - "Bernardini, Fiorentini and Vanderbilt, Phys. Rev. B 56, R10024
         (1997), doi 10.1103/PhysRevB.56.R10024. Table II read from the arXiv
         full text (cond-mat/9705105): P_sp = -0.081, -0.029 C/m2; e33 = 1.46,
         0.73 C/m2; e31 = -0.60, -0.49 C/m2 for AlN, GaN. Eq. (2):
         dP3 = e33 eps3 + e31 (eps1 + eps2)."
      - "Ambacher et al., J. Appl. Phys. 85, 3222 (1999), doi
         10.1063/1.369664. Cited for the statement that the bound sheet charge
         at a nitride heterointerface is the discontinuity of the total
         (spontaneous plus piezoelectric) polarization, which is the subject
         of the paper as stated in its title."
    claims_verified:
      - "Chang et al.: 'By growing a thin layer of GaN to ensure pseudomorphic
         compressive strain (by 2.4%) to the single-crystal bulk AlN
         substrate, a piezoelectric polarization component develops within the
         GaN layer.' and 'The combined discontinuity in spontaneous
         polarization and piezoelectric polarization determines the 2DHG
         density.' The strain is stated, not measured."
      - "Chang et al.: 'We observe a linear increase in the light hole mass
         from 0.48 m0 at 32 T to 0.69 m0 at 72 T.' and 'Extrapolating to
         B = 0 T, we obtain a mass of 0.30 m0'. Masses from fitting chi/sinh chi
         to FFT amplitudes between 1.8 and 15 K."
      - "Chang et al.: 'the density and Hall mobility of carriers in each band
         must be determined by fitting a two-channel Drude model'; Dill et al.:
         four free parameters, no constraint from quantum oscillations."
      - "Chang et al.: quantum mobility 368 +/- 14 cm2/Vs, 'a quantum
         scattering time of 0.15 ps', light mass 0.53 m0. These three are not
         mutually consistent (368 cm2/Vs with 0.53 m0 gives 0.111 ps), so the
         revised analysis uses the mass-free ratio mu_Hall/mu_q, which the same
         paper states as about 5 (light) and 2 to 2.5 (heavy)."
    correction: "The previous version formed the measured light-hole ratio as
      tau_tr/tau_q = 0.573/0.150 = 3.82, mixing the quoted 0.15 ps with a
      transport time converted at 0.53 m0. It is now mu_Hall/mu_q =
      1900/368 = 5.16; heavy 400/(167 to 200) = 2.00 to 2.40."

  second_revision_audit:
    date: 2026-09-25
    scope: "Every citation and every attributed claim in the revised Letter
      and Supplemental Material, re-read against the primary text where it
      was accessible."
    doi_check: "All nineteen DOIs resolved through the Crossref REST API and
      compared field by field (title, authors, journal, volume, issue, pages,
      year). All matched the bibliography; no bibliographic field changed."
    corrections:
      - "King et al. (1998): the valence band discontinuities are 0.5 +/- 0.2
         eV (GaN grown on AlN at 650 C) and 0.8 +/- 0.2 eV (800 C), as stated
         in the Crossref abstract and in the author-hosted PDF. The Letter had
         0.86 +/- 0.20 eV, a text-extraction artifact. Corrected to 0.8 +/- 0.2
         eV. The offsets scanned, 0.3 to 0.8 eV, now span exactly the
         published central values; no computed number changes."
      - "Rizzi et al. (1999), abstract: '(-0.3 +/- 0.1) eV for AlN/GaN, and
         [(0.15-0.4) +/- 0.1] eV for GaN/AlN' (substrate/overlayer). The
         Letter's structure is GaN grown on AlN, i.e. AlN/GaN in that
         notation, so 0.3 +/- 0.1 eV is the appropriate value. The Letter now
         writes 0.3 +/- 0.1 eV."
      - "Samples. The manuscript stated that the three experiments were made
         on the same gas and drew Fig. 1(a) as 'the heterostructure on which
         all three experiments were performed'. That is not so. Chang et al.
         report the quantum oscillations and the low-field Hall fit on the
         same sample ('For the present sample, this analysis yields Hall
         mobilities ~1900 ... and ~400') using 'the fitting algorithm
         described in our recent work' (their ref. 36 = Dill et al., J. Appl.
         Phys. 137, 025702). Wang et al. used an 8.2 nm undoped GaN layer on a
         700 nm AlN buffer without a Mg-doped cap and note that the layer
         thicknesses were not the same. Dill et al. used other samples (10 nm
         GaN on 700 nm AlN). Abstract, introduction, Fig. 1 caption and the
         heavy-hole-mass section corrected; Supplemental Material Sec. S8
         gains a paragraph on the samples."
      - "New calculation for the cyclotron-resonance sample (8.2 nm GaN,
         5.25e13 cm^-2): m_hh 2.008 / 1.938 and m_lh 0.361 / 0.270 m0 at
         offsets 0.3 / 0.7 eV (scripts/run_structure_check.py,
         results/structure_check.json). The sample difference changes the
         heavy-hole mass by less than one percent."
      - "Chang et al. give the range of the Hall fit, 'mu_LH = 1858 ~ 1986
         cm2/Vs and mu_HH = 381 ~ 464 cm2/Vs at T = 3 K'. The measured ratio
         ranges and the permissive box now include it: light 4.86 to 5.61
         (down to 2.75 with the mass reassignment), heavy 1.91 to 2.78.
         Nominal ratios (5.16, 2.20) and every point comparison are
         unchanged. Box comparisons: 1.71 -> 1.50 (published densities),
         1.60 -> 1.51 (density assignments), 1.61 -> 1.53 (screening),
         correlated disorder 1.79 -> 1.54 and 1.53 -> 1.44; apparent (fitted)
         box 2.28 -> 2.23. The Letter's statement 'at least a factor of 1.5'
         is unchanged."
      - "Spin degeneracy: the Letter said it was 'assumed in both
         experiments'. It is stated only in the quantum-oscillation analysis
         of Chang et al. ('neglecting Zeeman-splitting so that each of the
         plotted energy levels ... contains two spin-degenerate LLs').
         Corrected."
      - "Strain: 'not measured in these samples' replaced by 'not measured in
         Ref. [Chang]', since the cyclotron-resonance paper was not checked
         for this point."
      - "Costa et al.: the Letter said the Zeeman-cyclotron competition 'can
         compromise mass extraction'. The abstract states that 'evaluation of
         critical bandstructure and quantum transport parameters ... is
         challenging when competition emerges among different energy scales'.
         Reworded to 'complicates the extraction of band parameters from
         quantum oscillations of hole gases'. The work concerns germanium."
      - "Huang and Wu: 'the hole channel limits nitride complementary
         electronics' reworded to 'the limited performance of p-channel
         transistors is a barrier to complementary GaN logic'."
      - "Bader et al.: 'the standard mobility model' reworded to 'the mobility
         model of Bader et al.'; 'standard' was not supported."
      - "Introduction: 'the most detailed transport parameters available for
         any wide-bandgap hole system' was an unverifiable superlative;
         reworded to 'unusually detailed'."
    claims_verified:
      - "Rinke et al. (2008), Table V, AlN, OEPx(cLDA)+G0W0: A1 -3.991, A2
         -0.311, A3 3.671, A4 -1.147, A5 -1.329, A6 -1.952; Delta_CR -0.295
         eV. Identical to kp6_het.ALN_KP. Delta_SO is not given in that work."
      - "de Carvalho et al. (2010), Table II, wurtzite AlN: Delta_so 21.7 meV
         (parallel to c), 23.5 meV (perpendicular), Delta_cf -275.7 meV. The
         code uses 22 meV; 19, 21.7 and 23.5 meV give the same masses to four
         figures (results/structure_check.json)."
      - "Chang et al. reference 61 = Rinke et al. 2008 and reference 62 = Yan
         et al. 2014, as the Letter states."
      - "Chaudhuri et al. (2019): title 'A polarization-induced 2D hole gas in
         undoped gallium nitride quantum wells' supports 'forms at a GaN/AlN
         interface without acceptor doping'."

  light_hole_revision:
    date: 2026-09-25
    scope: "Statements and numbers added when the light-hole analysis and the
      two-mechanism scattering analysis were added to the Letter."
    claims_verified:
      - "Wang et al. (author-hosted PDF): 'The fitted CR frequencies, shown in
         Fig. 3, increase linearly with B, with slope that reveals meff. We
         find that mhh = 2.6me and mlh = 0.57me.' Also: 'without independent
         knowledge of meff that is provided by the cyclotron shift, the
         spectral weight reveals only the ratio N/meff.' The field range of
         their Fig. 3 was not read numerically; the experiment extends to
         31 T."
      - "Chang et al. (arXiv full text): the field-resolved light-hole masses
         are obtained by an LK fit 'for each light hole oscillation peak',
         with amplitudes 'taken from the fitted dashed lines in Fig. 2a',
         which are 'least-square fits to the single-channel LK formula,
         performed separately for each temperature'. The Dingle plot uses the
         light-hole peaks at 1.8 K and 15 K; 'mu_q has no discernable
         temperature dependence' (368 +/- 14 cm2/Vs). Clear light-hole
         oscillations from about 25 T."
      - "Rinke et al. (arXiv full text), Table V, GaN A6 = -3.202."
      - "Punya and Lambrecht, Phys. Rev. B 85, 195147 (2012), accepted
         manuscript read through the APS 'accepted' link: GaN A6 = -1.55, with
         -3.31 in parentheses (quasi-cubic value); 'Our results agree quite
         closely with those of Rinke et al. except for the parameter A6.'
         DOI and bibliographic fields checked against Crossref."
      - "Asgari et al., Phys. Rev. B 71, 045323 (2005), Table I, on-shell RPA
         m*/m of the 2D electron gas: 1.033, 1.168, 1.322, 1.696 at r_s = 1,
         2, 3, 5 (read from the Purdue e-Pubs copy). DOI and bibliographic
         fields checked against Crossref. Used only as a numerical benchmark."
      - "Vurgaftman and Meyer, J. Appl. Phys. 94, 3675 (2003): not accessible;
         its A6 value is therefore not quoted anywhere."

